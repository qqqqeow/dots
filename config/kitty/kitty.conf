# ────────────── Kitty Configuration (Glassmorphism & TokyoNight) ──────────────

# Шрифт
font_family      JetBrainsMono Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        11.0

# Прозрачность и размытие (Glassmorphism)
background_opacity 0.78
background_blur    1

# Отступы окна
window_padding_width 10
confirm_os_window_close 0

# Плавный курсор
cursor_shape beam
cursor_beam_thickness 1.5
cursor_blink_interval -1
cursor_trail 1
cursor_trail_decay 0.1 0.35

# Скроллбэк
scrollback_lines 5000

# Цветовая схема TokyoNight
foreground           #c0caf5
background           #1a1b26
selection_foreground none
selection_background #283457

# Черный
color0  #15161e
color8  #414868

# Красный
color1  #f7768e
color9  #f7768e

# Зеленый
color2  #9ece6a
color10 #9ece6a

# Желтый
color3  #e0af68
color11 #e0af68

# Синий
color4  #7aa2f7
color12 #7aa2f7

# Пурпурный
color5  #bb9af7
color13 #bb9af7

# Голубой
color6  #7dcfff
color14 #7dcfff

# Белый
color7  #a9b1d6
color15 #c0caf5
